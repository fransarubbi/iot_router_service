[package]
name = "iot_router_service"
version = "0.3.1"
edition = "2024"

[dependencies]
# Async Runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "signal"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# gRPC
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport", "gzip"] }
prost = "0.13"
tokio-stream = "0.1.17"
dotenv = "0.15.0"


axum = { version = "0.7", features = ["macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "timeout", "limit", "cors"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
anyhow = "1"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
tokio-rustls = "0.26"
x509-parser = "0.16"
dashmap = "6"
chrono = { version = "0.4", features = ["serde"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
toml = "0.8"


[build-dependencies]
tonic-build = "0.12"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
